; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

; 8 MB flash variant (DevKitC-N8R2). Default partition table is fine for the
; current firmware size; revisit if OTA/larger app needs the extra flash.
board_upload.flash_size = 8MB

; Console / serial plotter run over the native USB-C port (USB-Serial-JTAG,
; selected in sdkconfig.defaults). 115200 matches the IDF console default.
monitor_speed = 115200

build_flags =
    -DBOARD_HAS_PSRAM             ; Activates PSRAM (config in sdkconfig.defaults) 