[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; --- Native USB (the port labeled "ESP32-S3 Type-C USB & OTG") ---
; ARDUINO_USB_CDC_ON_BOOT=1  -> Serial is the native USB CDC, not UART0
; ARDUINO_USB_MODE=1         -> use the built-in USB-Serial/JTAG peripheral
; With these set, plug the cable into the ESP32-S3 USB/OTG port (GPIO19/20).
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; Native USB CDC ignores baud rate, but the monitor needs DTR asserted
; for Serial to report "connected".
monitor_dtr = 1
monitor_rts = 0

; To go back to the CH343P "USB to Serial" port, comment out build_flags above.
