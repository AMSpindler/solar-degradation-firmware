# mosquitto.conf — broker config for the CLOUDS bench test.
#
# Run the broker with this file (from the folder that contains it):
#     mosquitto -c mosquitto.conf -v
#
# Why this is needed: Mosquitto 2.x, run as plain `mosquitto -v`, only accepts
# connections from the same machine (localhost) and refuses anonymous clients.
# The ESP32 (and your phone/second computer) are remote + anonymous, so without
# this config they'd be refused even on a perfect network.

# Listen on port 1883 on ALL network interfaces (0.0.0.0), so devices on the
# same Wi-Fi/hotspot can reach the broker.
listener 1883 0.0.0.0

# Allow clients to connect without a username/password (fine for a lab bench;
# do NOT do this on an untrusted network).
allow_anonymous true

# --- Optional: survive a BROKER restart too -------------------------------
# The subscriber-crash recovery in mqtt_receiver.py already works without this
# (the broker holds queued messages in RAM). Enable the two lines below to also
# keep the queue on disk so it survives the broker itself restarting. Create the
# folder first:  mkdir -p mosquitto_data
#
# persistence true
# persistence_location ./mosquitto_data/